services:
  api:
    image: hashicorp/http-echo
    command: ["-listen=:8080", "-text=Monitoring Service Active"]
    expose:
      - "8080"
    networks:
      - monitoring-net

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge

configs:
  nginx_conf:
    content: |
      server {
          listen 80;
          location / {
              proxy_pass http://api:8080;
          }
      }
